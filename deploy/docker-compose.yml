services:
  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-only-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-only-root-token}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:latest
    env_file: runtime.env
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    env_file: runtime.env
    environment:
      RABBITMQ_DEFAULT_USER: payments
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    image: northwind/payment-api:${APP_VERSION:-1.2.0}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file: runtime.env
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-1.2.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      replicas: 2
    depends_on:
      - db
      - rabbitmq
    restart: unless-stopped

  worker:
    image: northwind/payment-worker:${APP_VERSION:-1.2.0}
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file: runtime.env
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - provider-certs:/certs:ro
    depends_on:
      - db
      - rabbitmq
      - mock-provider
    restart: unless-stopped

  mock-provider:
    image: northwind/mock-provider:local
    build:
      context: ..
      dockerfile: mock-provider/Dockerfile
    env_file: runtime.env
    volumes:
      - provider-certs:/certs
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://localhost:9443/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  reverse-proxy:
    image: nginx:latest
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq:
  provider-certs:
