services:
  vault:
    image: hashicorp/vault:1.15.4
    cap_add: [IPC_LOCK]
    environment:
      # Fallback на dev-root-token позволяет `docker compose up` без .env.
      # В CI подставляется реальный VAULT_DEV_ROOT_TOKEN из GitHub Secrets.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources: { limits: { memory: 256M } }

  db:
    image: postgres:13.14
    env_file: runtime.env
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources: { limits: { memory: 512M } }

  rabbitmq:
    image: rabbitmq:3.9.29-management
    env_file: runtime.env
    environment:
      RABBITMQ_DEFAULT_USER: payments
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources: { limits: { memory: 1024M } }

  api:
    image: northwind/payment-api:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file: runtime.env
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      db:       { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys,urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2); sys.exit(0)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    security_opt: [no-new-privileges:true]
    deploy:
      resources: { limits: { memory: 512M } }

  worker:
    image: northwind/payment-worker:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file: runtime.env
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - provider-certs:/certs:ro
    depends_on:
      db:       { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    security_opt: [no-new-privileges:true]
    deploy:
      resources: { limits: { memory: 512M } }

  mock-provider:
    image: northwind/mock-provider:${APP_VERSION:-local}   # ← было :local
    build:
      context: ..
      dockerfile: mock-provider/Dockerfile
    env_file: runtime.env
    volumes:
      - provider-certs:/certs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl,sys,urllib.request; urllib.request.urlopen('https://localhost:9443/health', context=ssl._create_unverified_context(), timeout=2); sys.exit(0)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
    security_opt: [no-new-privileges:true]
    deploy:
      resources: { limits: { memory: 256M } }

  reverse-proxy:
    image: nginx:1.25.5-alpine
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    deploy:
      resources: { limits: { memory: 128M } }

  prometheus:
    image: prom/prometheus:v2.50.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules.yml:/etc/prometheus/rules.yml:ro 
      - promdata:/prometheus
      
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    deploy:
      resources: { limits: { memory: 512M } }

volumes:
  pgdata:
  rabbitmq:
  provider-certs:
  promdata: