name: Payment Stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('services/**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install pytest ruff

   
      - name: Run tests
        run: |
          set -euo pipefail
          (cd services/api && pytest tests -v)
          (cd services/worker && pytest tests -v)

      - name: Lint
        run: ruff check services/api/ services/worker/

      - name: Record SHA
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

     
      - name: Build and push images
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          cd deploy
          docker compose build api worker mock-provider
          for svc in api worker mock-provider; do
            SRC="$(docker compose images -q "$svc" | head -n1)"
            if [ -z "$SRC" ]; then
              echo "Image for service '$svc' not found"
              exit 1
            fi
            docker tag "$SRC" "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
            docker push "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
          done

      - name: Install Trivy
        if: github.event_name == 'push'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan images (Trivy)
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for svc in api worker mock-provider; do
            echo "== Scanning ${svc} =="
            trivy image --no-progress --exit-code 0 --severity HIGH,CRITICAL \
              "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
          done

  cd:
    needs: ci
   
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

   
      - name: Deploy to production
        env:
          APP_VERSION: ${{ needs.ci.outputs.sha }}
        run: |
          set -euo pipefail
          cd deploy

          # Подтягиваем образы, собранные в CI
          for svc in api worker mock-provider; do
            docker pull "${REGISTRY}/${IMAGE_BASE}/${svc}:${APP_VERSION}"
            # Перетегируем под имена, которые ждёт docker-compose.yml
            case "$svc" in
              api)   TARGET="northwind/payment-api" ;;
              worker) TARGET="northwind/payment-worker" ;;
              mock-provider) TARGET="northwind/mock-provider" ;;
            esac
            docker tag "${REGISTRY}/${IMAGE_BASE}/${svc}:${APP_VERSION}" "${TARGET}:${APP_VERSION}"
          done

          # Окружение и vault (как в deploy.sh, но без build)
          touch runtime.env
          set -a
          . "env/prod.env"   # если у тебя stage — замени на stage
          set +a

          docker compose down
          docker compose up -d --wait vault
          ./vault/seed.sh prod
          ./vault/render-env.sh prod

          # Поднимаем сервисы из готовых образов
          docker compose up -d --remove-orphans

          for service in api worker mock-provider; do
            docker compose ps "$service"
          done

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1


      - name: Apply migrations
        run: |
          set -euo pipefail
          cd deploy
          if [ -f migrations/001_create_transfers.sql ]; then
            docker compose exec -T db \
              psql -U payments -d payments \
              < migrations/001_create_transfers.sql
            echo "Migrations applied"
          else
            echo "No migrations found at migrations/001_create_transfers.sql"
          fi

      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          cd deploy
          docker compose exec -T db pg_isready -U payments -d payments
          echo "All health checks passed"

      - name: Record deployment
        run: |
          mkdir -p artifacts
          {
            echo "Deployment SHA: ${SHA}"
            echo "Branch: main"
            echo "Deployed successfully"
            echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/deployment.txt
          cat artifacts/deployment.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: artifacts/deployment.txt