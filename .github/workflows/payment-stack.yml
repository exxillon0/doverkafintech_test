name: Payment Stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('services/**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Record SHA
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          APP_VERSION: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          cd deploy
          touch runtime.env
          docker compose build api worker mock-provider
          for svc in api worker mock-provider; do
            case "$svc" in
              api)           SRC="northwind/payment-api:${APP_VERSION}" ;;
              worker)        SRC="northwind/payment-worker:${APP_VERSION}" ;;
              mock-provider) SRC="northwind/mock-provider:${APP_VERSION}" ;;
            esac
            docker image inspect "$SRC" >/dev/null
            docker tag "$SRC" "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
            docker push "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
          done

      - name: Install Trivy
        if: github.event_name == 'push'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan images (Trivy — blocking for CRITICAL)
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for svc in api worker mock-provider; do
            trivy image --no-progress \
              --exit-code 1 --severity CRITICAL --ignore-unfixed \
              "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
            # HIGH — non-blocking, только лог
            trivy image --no-progress --exit-code 0 --severity HIGH \
              "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
          done

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write prod env from secrets
        run: |
          mkdir -p deploy/env
          cat > deploy/env/prod.env <<EOF
          VAULT_DEV_ROOT_TOKEN=${{ secrets.VAULT_DEV_ROOT_TOKEN }}
          API_PORT=80
          LOG_LEVEL=INFO
          EOF

      - name: Deploy (make deploy ENV=prod)
        run: make deploy ENV=prod APP_VERSION="${APP_VERSION}"

      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: make smoke ENV=prod

      - name: Auto-rollback on failed smoke
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke failed — rolling back"
          make rollback ENV=prod
          echo "::error::Rolled back. Fix the issue and redeploy."

      - name: Fail the job if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1