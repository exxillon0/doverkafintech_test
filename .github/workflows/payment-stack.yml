name: Payment Stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('services/**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install pytest ruff

      # python -m pytest добавляет cwd в sys.path → `import app` работает
      - name: Run tests
        run: |
          set -euo pipefail
          (cd services/api && python -m pytest tests -v)
          (cd services/worker && python -m pytest tests -v)

      - name: Lint
        run: ruff check services/api/ services/worker/

      - name: Record SHA
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_VERSION=SHA заставит compose протегировать образы
      # как northwind/payment-api:<SHA> и т.д. через ${APP_VERSION:-...}
      - name: Build and push images
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          APP_VERSION: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          cd deploy
          touch runtime.env
          docker compose build api worker mock-provider

          for svc in api worker mock-provider; do
            case "$svc" in
              api)           SRC="northwind/payment-api:${APP_VERSION}" ;;
              worker)        SRC="northwind/payment-worker:${APP_VERSION}" ;;
              mock-provider) SRC="northwind/mock-provider:${APP_VERSION}" ;;
            esac
            if ! docker image inspect "$SRC" >/dev/null 2>&1; then
              echo "Image $SRC not found after build"
              docker images | grep -E 'northwind|payment' || docker images
              exit 1
            fi
            docker tag "$SRC" "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
            docker push "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
          done

      - name: Install Trivy
        if: github.event_name == 'push'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan images (Trivy)
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for svc in api worker mock-provider; do
            echo "== Scanning ${svc} =="
            trivy image --no-progress --exit-code 0 --severity HIGH,CRITICAL \
              "${REGISTRY}/${IMAGE_BASE}/${svc}:${SHA}"
          done

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        env:
          APP_VERSION: ${{ needs.ci.outputs.sha }}
        run: |
          set -euo pipefail
          cd deploy

          # Подтягиваем образы из GHCR и перетегируем под имена compose
          for svc in api worker mock-provider; do
            docker pull "${REGISTRY}/${IMAGE_BASE}/${svc}:${APP_VERSION}"
            case "$svc" in
              api)           TARGET="northwind/payment-api" ;;
              worker)        TARGET="northwind/payment-worker" ;;
              mock-provider) TARGET="northwind/mock-provider" ;;
            esac
            docker tag "${REGISTRY}/${IMAGE_BASE}/${svc}:${APP_VERSION}" "${TARGET}:${APP_VERSION}"
          done

          # env + vault
          touch runtime.env
          set -a
          . "env/prod.env"
          set +a

          docker compose down
          docker compose up -d --wait vault
          ./vault/seed.sh prod
          ./vault/render-env.sh prod

          docker compose up -d --remove-orphans
          for service in api worker mock-provider; do
            docker compose ps "$service"
          done

      # api не публикует порт наружу — только reverse-proxy.
      # Поэтому health-check выполняется ВНУТРИ контейнера api.
      - name: Wait for API health
        run: |
          cd deploy
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs --tail=100 api || true
          exit 1

      - name: Apply migrations
        run: |
          set -euo pipefail
          cd deploy
          if [ -f migrations/001_create_transfers.sql ]; then
            docker compose exec -T db \
              psql -U payments -d payments \
              < migrations/001_create_transfers.sql
            echo "Migrations applied"
          else
            echo "No migrations found at migrations/001_create_transfers.sql"
          fi

      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          cd deploy
          # API
          docker compose exec -T api python -c \
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
          # DB
          docker compose exec -T db pg_isready -U payments -d payments
          # Reverse-proxy (снаружи, через опубликованный порт)
          if curl -fsS "http://localhost:${API_PORT:-8080}/health" >/dev/null 2>&1; then
            echo "Reverse-proxy /health OK"
          else
            echo "WARN: reverse-proxy /health not reachable at :${API_PORT:-8080} (check nginx.conf)"
          fi
          echo "All health checks passed"

      - name: Record deployment
        run: |
          mkdir -p artifacts
          {
            echo "Deployment SHA: ${SHA}"
            echo "Branch: main"
            echo "Deployed successfully"
            echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/deployment.txt
          cat artifacts/deployment.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: artifacts/deployment.txt