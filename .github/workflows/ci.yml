name: ci

on:
  push:
    branches: [release-prod]

jobs:
  build:
    runs-on: [self-hosted, northwind-builder]
    timeout-minutes: 30
    strategy:
      matrix:
        service: [api, worker, mock-provider]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install pytest -r services/api/requirements.txt -r services/worker/requirements.txt
          PYTHONPATH=services/api pytest services/api/tests
          PYTHONPATH=services/worker pytest services/worker/tests
      - name: Build
        run: |
          touch deploy/runtime.env
          docker compose -f deploy/docker-compose.yml build ${{ matrix.service }}
